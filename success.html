<script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ticketId = urlParams.get('ticketId');

      if (!ticketId) {
        alert('ไม่พบรหัสเหตุการณ์');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('displayTicketId').innerText = ticketId;

      // ดึงข้อมูลจาก Supabase
      const { data: report, error } = await supabaseClient
        .from('riskcheck_reports')
        .select('*')
        .eq('id', ticketId)
        .single();

      if (error) {
        console.error('Fetch error:', error);
        alert('เกิดข้อผิดพลาดในการดึงข้อมูลจาก Supabase: ' + error.message);
        return;
      }

      if (!report) {
        alert('ไม่พบข้อมูลรายการนี้ในฐานข้อมูล');
        return;
      }

      const scoreBadge = document.getElementById('riskScoreBadge');
      scoreBadge.innerText = `คะแนน Risk Matrix: ${report.risk_score} (L:${report.likelihood} × S:${report.severity})`;

      const levelTag = document.getElementById('riskLevelTag');
      levelTag.innerText = report.risk_level;
      levelTag.className = `text-xs font-bold px-3 py-1 rounded-full ${report.risk_color}`;

      if (report.control_tier) {
        document.getElementById('controlTier').innerText = report.control_tier;
        document.getElementById('controlAction').innerText = report.control_action;
      }

      const areaNamesTH = {
        'Line A': 'ฝั่งการผลิต (Line A)',
        'Line B': 'ฝั่งการผลิต (Line B)',
        'Warehouse': 'คลังสินค้า (Warehouse)',
        'Maintenance': 'แผนกซ่อมบำรุง (Maintenance)',
        'Office': 'สำนักงาน (Office)'
      };

      const hazardNamesTH = {
        'Slip/Trip/Fall': 'ลื่น/สะดุด/ล้ม',
        'Working at Height': 'ทำงานบนที่สูง',
        'Chemical': 'สารเคมีรั่วไหล/สัมผัส',
        'Machinery': 'เครื่องจักรหนีบ/ตัด',
        'Electrical': 'กระแสไฟฟ้า/สายไฟชำรุด',
        'Other': 'อื่น ๆ'
      };

      const genderTH = { 'Male': 'ชาย', 'Female': 'หญิง' };
      const reporterGenderStr = genderTH[report.reporter_gender] || report.reporter_gender;
      const reporterRoleStr = report.reporter_role ? `[${report.reporter_role}] ` : '';
      const reporterName = `${reporterRoleStr}${report.reporter_first_name} ${report.reporter_last_name} (${reporterGenderStr}, ${report.reporter_age} ปี)`;
      
      document.getElementById('summaryReporter').innerText = reporterName;
      document.getElementById('summaryArea').innerText = areaNamesTH[report.area] || report.area;
      document.getElementById('summaryDatetime').innerText = report.incident_datetime;
      document.getElementById('summaryHazard').innerText = hazardNamesTH[report.hazard_type] || report.hazard_type;
      document.getElementById('summaryDesc').innerText = report.description;

      const statusPending = document.getElementById('statusPending');
      const statusProgress = document.getElementById('statusProgress');
      const statusClosed = document.getElementById('statusClosed');
      const inactiveClass = 'p-2 rounded-lg bg-slate-100 text-slate-400 font-normal';

      if (report.status === 'In Progress') {
        statusPending.className = inactiveClass;
        statusProgress.className = 'p-2 rounded-lg bg-amber-500 text-white font-bold';
        statusClosed.className = inactiveClass;
      } else if (report.status === 'Closed') {
        statusPending.className = inactiveClass;
        statusProgress.className = inactiveClass;
        statusClosed.className = 'p-2 rounded-lg bg-emerald-600 text-white font-bold';
      } else {
        statusPending.className = 'p-2 rounded-lg bg-[#7E212A] text-white font-bold';
        statusProgress.className = inactiveClass;
        statusClosed.className = inactiveClass;
      }
    });
  </script>
