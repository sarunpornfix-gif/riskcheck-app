<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiskCheck - รายงานเหตุการณ์ Near Miss</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- LINE LIFF SDK (สำหรับดึง User ID และส่ง Flex Message) -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Supabase SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>

  <!-- Main Logic -->
  <script defer src="js/app.js"></script>

  <style>
    :root {
      --primary-color: #7E212A;
      --secondary-color: #BFD9DC;
    }
  </style>
</head>
<body class="bg-[#BFD9DC]/40 min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-[#7E212A] text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        RiskCheck
      </h1>
      <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-medium">รายงานความเสี่ยง</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <form id="nearMissForm" class="bg-white rounded-xl shadow-md p-5 border border-slate-100 space-y-4">

      <!-- บทบาทผู้รายงาน -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">สถานะผู้รายงาน</label>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <label class="flex items-center gap-1.5 p-2 border rounded-lg cursor-pointer hover:bg-slate-50 border-slate-200">
            <input type="radio" name="reporterRole" value="ผู้พบเห็นเหตุการณ์" checked class="accent-[#7E212A]">
            <span>ผู้พบเห็น</span>
          </label>
          <label class="flex items-center gap-1.5 p-2 border rounded-lg cursor-pointer hover:bg-slate-50 border-slate-200">
            <input type="radio" name="reporterRole" value="ผู้ประสบเหตุ" class="accent-[#7E212A]">
            <span>ผู้ประสบเหตุ</span>
          </label>
          <label class="flex items-center gap-1.5 p-2 border rounded-lg cursor-pointer hover:bg-slate-50 border-slate-200">
            <input type="radio" name="reporterRole" value="จป. / หัวหน้างาน" class="accent-[#7E212A]">
            <span>จป./หัวหน้า</span>
          </label>
        </div>
      </div>

      <!-- ข้อมูลผู้รายงาน -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อผู้แจ้ง</label>
          <input type="text" id="reporterFirstName" required placeholder="ชื่อ" class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A]">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">นามสกุล</label>
          <input type="text" id="reporterLastName" required placeholder="นามสกุล" class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A]">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">อายุ (ปี)</label>
          <input type="number" id="reporterAge" required min="15" max="99" placeholder="เช่น 30" class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A]">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เพศ</label>
          <select id="reporterGender" required class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A] bg-white">
            <option value="Male">ชาย</option>
            <option value="Female">หญิง</option>
          </select>
        </div>
      </div>

      <hr class="border-slate-100">

      <!-- พื้นที่เกิดเหตุ -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">พื้นที่เกิดเหตุ (Area)</label>
        <select id="area" required class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A] bg-white">
          <option value="">-- เลือกพื้นที่เกิดเหตุ --</option>
          <option value="Line A">ฝั่งการผลิต (Line A)</option>
          <option value="Line B">ฝั่งการผลิต (Line B)</option>
          <option value="Warehouse">คลังสินค้า (Warehouse)</option>
          <option value="Maintenance">แผนกซ่อมบำรุง (Maintenance)</option>
          <option value="Office">สำนักงาน (Office)</option>
        </select>
      </div>

      <!-- วันเวลาเกิดเหตุ -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">วันที่และเวลาเกิดเหตุ</label>
        <div class="grid grid-cols-3 gap-2">
          <input type="date" id="incidentDate" required class="col-span-1 text-xs p-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A]">
          <select id="incidentHour" required class="text-xs p-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A] bg-white"></select>
          <select id="incidentMinute" required class="text-xs p-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A] bg-white"></select>
        </div>
      </div>

      <!-- ประเภทอันตราย -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ประเภทอันตราย (Hazard Type)</label>
        <select id="hazardType" required onchange="toggleOtherHazard(this.value)" class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A] bg-white">
          <option value="">-- เลือกประเภทอันตราย --</option>
          <option value="Slip/Trip/Fall">ลื่น/สะดุด/ล้ม (Slip/Trip/Fall)</option>
          <option value="Working at Height">ทำงานบนที่สูง (Working at Height)</option>
          <option value="Chemical">สารเคมีรั่วไหล/สัมผัส (Chemical)</option>
          <option value="Machinery">เครื่องจักรหนีบ/ตัด (Machinery)</option>
          <option value="Electrical">กระแสไฟฟ้า/สายไฟชำรุด (Electrical)</option>
          <option value="Other">อื่น ๆ (Other)</option>
        </select>
      </div>

      <div id="otherHazardContainer" class="hidden">
        <label class="block text-xs font-semibold text-slate-600 mb-1">ระบุประเภทอันตรายเพิ่มเติม</label>
        <input type="text" id="otherHazardDetail" placeholder="ระบุรายละเอียดอันตราย..." class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A]">
      </div>

      <hr class="border-slate-100">

      <!-- ประเมิน Risk Matrix -->
      <div class="space-y-3">
        <h3 class="text-xs font-bold text-slate-700">การประเมินความเสี่ยง (Risk Assessment)</h3>
        
        <div>
          <label class="block text-[11px] text-slate-500 mb-1">ระดับความรุนแรง (Severity: 1 น้อยสุด - 5 สูงสุด)</label>
          <div class="flex justify-between gap-1 text-xs">
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="severity" value="1" required class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">1</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="severity" value="2" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">2</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="severity" value="3" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">3</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="severity" value="4" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">4</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="severity" value="5" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">5</span></label>
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-slate-500 mb-1">โอกาสเกิดซ้ำ (Likelihood: 1 น้อยสุด - 5 สูงสุด)</label>
          <div class="flex justify-between gap-1 text-xs">
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="likelihood" value="1" required class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">1</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="likelihood" value="2" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">2</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="likelihood" value="3" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">3</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="likelihood" value="4" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">4</span></label>
            <label class="flex-1 text-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="radio" name="likelihood" value="5" class="sr-only peer"><span class="block peer-checked:bg-[#7E212A] peer-checked:text-white rounded py-1 font-bold">5</span></label>
          </div>
        </div>
      </div>

      <hr class="border-slate-100">

      <!-- อธิบายเพิ่มเติม & รูปภาพ -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">รายละเอียดเหตุการณ์เพิ่มเติม</label>
        <textarea id="description" rows="3" placeholder="อธิบายสภาพความเสี่ยงหรือเหตุการณ์ที่เกิดขึ้น..." class="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#7E212A]"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">แนบรูปถ่ายประกอบ (ถ้ามี)</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#7E212A] file:text-white hover:file:bg-[#631921]">
      </div>

      <!-- ปุ่มส่งรายงาน -->
      <button type="submit" class="w-full bg-[#7E212A] hover:bg-[#631921] text-white font-bold py-3 rounded-lg shadow-md transition-colors text-sm mt-2">
        ส่งรายงานทันที
      </button>
    </form>
  </main>

  <script>
    // สร้างตัวเลือก ชั่วโมง/นาที และกำหนดวันที่เริ่มต้นเป็นวันนี้
    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('incidentDate');
      if (dateInput) {
        dateInput.value = new Date().toISOString().split('T')[0];
      }

      const hourSelect = document.getElementById('incidentHour');
      const minuteSelect = document.getElementById('incidentMinute');
      
      if (hourSelect && minuteSelect) {
        const now = new Date();
        const currentHour = String(now.getHours()).padStart(2, '0');
        const currentMin = String(now.getMinutes()).padStart(2, '0');

        for (let i = 0; i < 24; i++) {
          const h = String(i).padStart(2, '0');
          const opt = document.createElement('option');
          opt.value = h;
          opt.innerText = h + ' น.';
          if (h === currentHour) opt.selected = true;
          hourSelect.appendChild(opt);
        }

        for (let i = 0; i < 60; i += 5) {
          const m = String(i).padStart(2, '0');
          const opt = document.createElement('option');
          opt.value = m;
          opt.innerText = m + ' นาที';
          if (parseInt(m) <= parseInt(currentMin) && parseInt(m) + 5 > parseInt(currentMin)) opt.selected = true;
          minuteSelect.appendChild(opt);
        }
      }
    });

    function toggleOtherHazard(val) {
      const container = document.getElementById('otherHazardContainer');
      if (val === 'Other') {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
